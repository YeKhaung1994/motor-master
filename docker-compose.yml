services:
  db:
    image: postgres:16-alpine
    container_name: motor-master-db
    environment:
      POSTGRES_DB: motor_master
      POSTGRES_USER: motor_master
      POSTGRES_PASSWORD: motor_master_dev
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor_master -d motor_master"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  pg-data:
