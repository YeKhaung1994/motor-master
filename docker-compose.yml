services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: motor-master-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MotorMaster!2024"
      MSSQL_PID: Developer
      # SQL Server will otherwise size its buffer pool to the whole machine and
      # get OOM-killed (exit 137) on a Docker VM this size, taking the API with it.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
