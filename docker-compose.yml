services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: motor-master-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MotorMaster!2024"
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
